<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de paletas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="./css/styles.css" >
</head>
<body>
    <header class = "header">
        <h1 class = "title">Generador de paletas</h1>
        <p class = "subtitle">Descubre y crea combinaciones perfectas.</p>
    </header>

    <main class = "main-content">
        <section class = "controls-section">
            <div class = "controls-container">
                <div class = "input-group">
                    <label for="palette-size" class = "label">Cantidad:</label>
                    <div class = "select-wrapper">
                        <select id="palette-size" class="size-select">
                            <option value="6">6 Colores</option>
                            <option value="8">8 Colores</option>
                            <option value="9">9 Colores</option>
                        </select>
                        <span class = "material-symbols-outlined select-icon">expand_more</span>
                    </div>
                </div>

                <div class = "input-group">
                    <label for="format-select" class="label">Formato:</label>
                    <div class="select-wrapper">
                        <select id="format-select" class="size-select">
                            <option value="hex">HEX</option>
                            <option value="hsl">HSL</option>
                        </select>
                        <span class = "material-symbols-outlined select-icon">expand_more</span>
                    </div>
                </div>

                <button id = "generate-btn" class="btn btn-primary">
                    <span class="material-symbols-outlined">auto_awesome</span>
                    Generar Paleta
                </button>
            </div>
        </section>
        <section id = "palette-container" class = "palette-container"></section>
    </main>
    <script src="./js/main.js"></script>
</body>
</html>
